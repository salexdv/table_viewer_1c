name: Публикация HTML-сборки

# Собирает автономный dist/index.html и прикладывает его к опубликованному релизу
# как table_viewer.html. Ручной запуск сохраняет тот же файл в Actions Artifacts.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-html:
    runs-on: ubuntu-latest

    steps:
      - name: Получение исходников
        uses: actions/checkout@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Установка зависимостей
        run: npm ci --no-audit --no-fund

      - name: Сборка автономного HTML
        run: npm run build

      - name: Подготовка артефакта
        run: cp dist/index.html table_viewer.html

      - name: Приложить файл к релизу
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" table_viewer.html --clobber

      - name: Сохранить артефакт ручного запуска
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: table_viewer-html
          path: table_viewer.html
          if-no-files-found: error
